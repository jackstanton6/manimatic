name: CI

on:
  push:
  pull_request:

jobs:
  core:
    # pipeline logic (ingest, alignment, cuts, plan, references, captions) on every OS
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        # from each OS's package manager: setup-ffmpeg actions break on download hiccups and on Apple Silicon runners
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  render:
    # ManimGX (the default engine) + OCR on Linux, drawing on the CPU with the lavapipe bundled in
    # its wheel: render-worker tests, components, 3D projection, and a full demo build (mock transcript).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg tesseract-ocr
      - run: pip install -e ".[dev,render,ocr]" -c constraints.txt
      - run: pytest -q -rs
      - name: Build the demo preview
        env:
          MANIMATIC_NO_VENV: "1"
        run: |
          cp -r examples/demo /tmp/demo
          sed -i 's/^asr_backend = .*/asr_backend = "mock"/' /tmp/demo/manimatic.toml
          python mm.py -C /tmp/demo prepare
          python mm.py -C /tmp/demo build --preview
          test -f /tmp/demo/output/why-primes-matter.preview.mp4
          test -f /tmp/demo/output/why-primes-matter.preview.srt

  fallback:
    # The Manim CE fallback engine ([render] engine = "manim"): same scene files, Manim CE + LaTeX.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg texlive texlive-latex-extra texlive-fonts-extra cm-super dvisvgm \
            libcairo2-dev libpango1.0-dev pkg-config
      - run: pip install -e ".[dev,render,manim-ce]" -c constraints.txt
      - run: pytest -q -rs tests/test_render.py -k "manim and not manimgx"

  asr:
    # Real transcription: faster-whisper tiny.en on a noise-gated clip and on the demo, then the
    # edited voice is transcribed again and checked against the script (no ghost words).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev,asr]" -c constraints.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-tiny-en
      - name: Real-transcription tests
        env:
          MANIMATIC_NO_VENV: "1"
          MANIMATIC_REQUIRE_ASR: "1"
        run: pytest -q -rs tests/test_checks.py -k real_whisper
      - name: Demo through real transcription, voice check must be clean
        env:
          MANIMATIC_NO_VENV: "1"
        run: |
          cp -r examples/demo /tmp/demo
          sed -i 's/^asr_backend = .*/asr_backend = "faster-whisper"/; s/^asr_model = .*/asr_model = "tiny.en"/' /tmp/demo/manimatic.toml
          python mm.py -C /tmp/demo prepare
          python mm.py -C /tmp/demo status
          python - <<'PY'
          import json
          v = json.load(open("/tmp/demo/.manimatic/audio_check.json"))["voice"]
          print(json.dumps(v, indent=1))
          bad = [i for i in v.get("issues", []) if i["kind"] in ("extra word in a pause", "sound in a hold")]
          assert "skipped" not in v and not bad, bad
          PY
