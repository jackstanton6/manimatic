[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manimatic"
version = "0.2.0"
description = "Narration-driven Manim video production for Claude Code"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Jack Stanton" }]
keywords = ["manim", "maths", "animation", "video", "narration", "whisper", "claude-code"]
dependencies = [
  "numpy>=1.24",
  "rapidfuzz>=3.0",
  "pypdf>=4.0",
  "pypdfium2>=4.30",
  "pillow>=9",
  "tomli>=2.0; python_version<'3.11'",
]

[project.optional-dependencies]
render = ["manimgx>=0.1.1,<0.2; python_version>='3.13'", "ty>=0.0.80,<0.1"]   # ManimGX needs Python 3.13+
manim-ce = ["manim>=0.19,<0.23", "pillow<13"]   # fallback engine; needs LaTeX
asr = ["faster-whisper>=1.0", "av<19"]   # PyAV 19 broke faster-whisper 1.2.1
whisperx = ["whisperx>=3.1"]
tts = ["pyttsx3>=2.90"]
ocr = ["rapidocr>=3.0", "onnxruntime>=1.17"]   # bundled OCR models; Tesseract is used instead when installed
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/jackstanton6/manimatic"
Issues = "https://github.com/jackstanton6/manimatic/issues"

[project.scripts]
manimatic = "manimatic.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
